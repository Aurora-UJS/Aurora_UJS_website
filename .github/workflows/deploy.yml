name: Deploy to GitHub Pages
run-name: build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: only what Pages deploy needs (fixes the old over-broad
# contents:write + the pull_request_target "pwn request" hole).
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; cancel superseded runs (fixes the old racy gh-pages push).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
